name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nexus-tech-learning-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-tech-learning-android-apk
          path: nexus-tech-learning-*.apk
          if-no-files-found: error
          retention-days: 30
