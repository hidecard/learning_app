name: Release all platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk nexus-tech-learning-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: nexus-tech-learning-android.apk

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: tar -czf nexus-tech-learning-web.tar.gz -C build web
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: nexus-tech-learning-web.tar.gz

  windows:
    name: Windows EXE bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            $firebaseCmake = Get-ChildItem -Path 'build/windows' -Recurse -Filter 'CMakeLists.txt' |
              Where-Object { $_.FullName -like '*firebase_cpp_sdk_windows*' } |
              Select-Object -First 1
            if ($null -eq $firebaseCmake) { exit $LASTEXITCODE }
            $content = Get-Content $firebaseCmake.FullName -Raw
            $content = $content -replace 'cmake_minimum_required\(VERSION\s+[0-9.]+\)', 'cmake_minimum_required(VERSION 3.5)'
            Set-Content -Path $firebaseCmake.FullName -Value $content -NoNewline
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nexus-tech-learning-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: nexus-tech-learning-windows.zip

  release:
    name: Publish GitHub Release
    needs: [android, web, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
